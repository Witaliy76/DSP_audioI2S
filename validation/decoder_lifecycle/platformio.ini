; Host compile of decoder_lifecycle_test.cpp against production src/decoder_lifecycle.h.
; Not FreeRTOS. platform = native downloads a host toolchain when needed.

[env:native]
platform = native
build_flags = -std=c++20 -pthread -Wall -Wextra -Werror
; Source is copied into src/ by run_native.ps1 / run.ps1 so PlatformIO finds it.
