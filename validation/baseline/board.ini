; Shared ESP32-S3 + PSRAM target for the AF-1.1 compile baseline.
; RU: Общая плата контрольной сборки. Версия платформы закреплена за уже установленным pioarduino 55.03.312.
; EN: Shared control-build board. The platform URL is pinned to the already installed pioarduino 55.03.312.

[env:esp32s3-psram]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
; Arduino IDE injects this via platform.txt (build.code_debug=0). pioarduino does not.
build_flags = -DCORE_DEBUG_LEVEL=0
